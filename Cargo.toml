[package]
name = "rust-win-tool"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rust-win-tool"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
app-core = { path = "lib/core" }
app-utils = { path = "lib/utils" }
app-service = { path = "lib/service" }
anyhow = "1"
dirs = "5"
winreg = "0.55"
unicode-width = "0.2"
