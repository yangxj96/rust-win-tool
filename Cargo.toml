[package]
name = "rust-win-tool"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rust-win-tool"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
gpui = "=0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
app-service = { path = "lib/service" }
winreg = "0.55"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
